name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  secrets:
    # Scans the full history for secrets, and refuses committed virtualenvs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --config /repo/.gitleaks.toml
      - name: no committed virtualenvs
        run: |
          if git ls-files | grep -E '(^|/)pyvenv\.cfg$'; then
            echo "a virtualenv is committed"; exit 1
          fi

  lab:
    # Builds the five-host Docker lab and runs the end-to-end tests over real SSH.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run python lab/setup_lab.py
      - run: docker compose -f lab/docker-compose.yml --profile build build base
      - run: docker compose -f lab/docker-compose.yml up -d --build
      - run: sleep 30 && uv run wheelhouse --inventory lab/wheelhouse.lab.yaml hosts
      - run: WHEELHOUSE_LAB=1 uv run pytest tests/lab -v
      - if: always()
        run: docker compose -f lab/docker-compose.yml down
