server {
    listen 80;
    # Resolve app01 at request time (Docker's DNS), so nginx starts even if app01 is
    # not up yet. Drills can still break this on purpose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orders_api http://app01:8080;
    location / {
        proxy_pass $orders_api;
        proxy_connect_timeout 2s;
    }
}
